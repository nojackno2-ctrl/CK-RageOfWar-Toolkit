# 推 v* 標籤時建置並發布 Release。
#
# 與 ckperf.yml 同一套原則：發布物由 GitHub runner 從原始碼建置、附上可查核的
# build provenance 證明，而不是由某台開發機上傳一包來路只能靠信任的檔案。
# 這是個會修改遊戲檔案並注入行程的工具，「請相信我」不是可接受的答案。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # 建立 Release
  id-token: write        # attestation 簽章
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # action 一律釘 commit SHA，理由同 ckperf.yml。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # workflow_dispatch 只允許在 tag ref 上重跑；任何 tag 與程式版本不一致
      # 都在建置前失敗，避免把舊版號的 EXE 發成新版本。
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag') {
            throw 'Release workflow 必須從 v* tag 執行；workflow_dispatch 請選擇既有 tag ref。'
          }

          [xml]$project = Get-Content 'src/CKToolkit/CKToolkit.csproj' -Raw
          $versionNodes = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
          if ($versionNodes.Count -ne 1) {
            throw "CKToolkit.csproj 必須恰好有一個 Version；目前找到 $($versionNodes.Count) 個。"
          }

          $version = [string]$versionNodes[0]
          $expectedTag = "v$version"
          if ('${{ github.ref_name }}' -cne $expectedTag) {
            throw "tag '${{ github.ref_name }}' 與程式版本 '$version' 不一致；預期 tag 為 '$expectedTag'。"
          }

          "CKTOOLKIT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release tag/version：$expectedTag"

      # 先跑自我測試再打包。SelfTest 用合成的遊戲檔案，不需要安裝遊戲，
      # 所以沒有理由讓它只在開發機上跑過。測試不過就不該有 Release。
      - name: Run self-test
        run: dotnet run --project src/CKToolkit.SelfTest/CKToolkit.SelfTest.csproj -c Release

      # 正式 EXE 必須內嵌同一個 release job 從 src/CKPerf 建出的 DLL，不能只信任
      # repository 內預建的 assets/ckperf/ckperf.dll 或另一個 workflow 的證明。
      - name: Build ckperf.dll for the release EXE (Release|Win32)
        run: msbuild src\CKPerf\CKPerf.vcxproj /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo

      - name: Stage source-built ckperf.dll for embedding
        shell: pwsh
        run: |
          $built = 'dist\ckperf\Release\ckperf.dll'
          $asset = 'assets\ckperf\ckperf.dll'
          if (-not (Test-Path $built)) { throw "建置成功但找不到輸出：$built" }

          Copy-Item $built $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $asset).Length
          [System.IO.File]::WriteAllText(
            "$PWD\ckperf-release-sha256.txt",
            "$hash *ckperf.dll`n",
            [System.Text.UTF8Encoding]::new($false))
          Write-Host "正式 EXE 將內嵌 source-built ckperf.dll：$size bytes / $hash"

      # 兩種打包並存，因為使用者分兩種：
      #   framework-dependent  3 MB，但需要先裝 .NET 10 Desktop Runtime
      #   self-contained      50 MB，什麼都不用裝，雙擊即用
      # 這個工具的受眾多半不是開發者，所以自包含版才是預設推薦。
      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/CKToolkit/CKToolkit.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:DebugType=none
          -o publish/fd

      - name: Publish (self-contained)
        run: >
          dotnet publish src/CKToolkit/CKToolkit.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/sc

      # SelfTest 在原生重建前執行，它驗證的是 repository 白名單資產。
      # 這一步另外直接讀 publish 實際使用的 managed assembly manifest
      # resource，證明單檔打包器的輸入內嵌的就是本次 source-built DLL。
      - name: Verify publish input embeds source-built ckperf.dll
        shell: pwsh
        run: |
          $assemblyPath = Resolve-Path 'src\CKToolkit\bin\Release\net10.0-windows\win-x64\CKToolkit.dll'
          $sourcePath = Resolve-Path 'assets\ckperf\ckperf.dll'
          $assembly = [System.Reflection.Assembly]::LoadFile($assemblyPath.Path)
          $stream = $assembly.GetManifestResourceStream('CKToolkit.Runtime.ckperf.dll')
          if ($null -eq $stream) {
            throw 'publish 輸入 assembly 找不到 CKToolkit.Runtime.ckperf.dll resource。'
          }

          try {
            $memory = [System.IO.MemoryStream]::new()
            try {
              $stream.CopyTo($memory)
              $embeddedBytes = $memory.ToArray()
            }
            finally {
              $memory.Dispose()
            }
          }
          finally {
            $stream.Dispose()
          }

          $sourceBytes = [System.IO.File]::ReadAllBytes($sourcePath.Path)
          $embeddedHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData($embeddedBytes)).ToLowerInvariant()
          $sourceHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData($sourceBytes)).ToLowerInvariant()
          if ($embeddedBytes.Length -ne $sourceBytes.Length -or $embeddedHash -cne $sourceHash) {
            throw "publish 輸入內嵌 CKPerf 與 source-built DLL 不同：embedded $($embeddedBytes.Length)/$embeddedHash; source $($sourceBytes.Length)/$sourceHash"
          }
          Write-Host "publish 輸入已內嵌 source-built ckperf.dll：$($embeddedBytes.Length) bytes / $embeddedHash"

      # CKToolkit 是 WinExe/GUI subsystem；PowerShell 的 call operator 不會可靠等待。
      # 用 ProcessStartInfo 同步讀 stdout/stderr，驗證真正的發布 EXE，而不是只在
      # SelfTest 內直接呼叫 CliHost。
      - name: Smoke-test published CLI JSON contracts
        shell: pwsh
        run: |
          function Invoke-CliJson {
            param(
              [Parameter(Mandatory)][string]$Exe,
              [Parameter(Mandatory)][string[]]$Arguments,
              [int]$ExpectedExitCode = 0
            )

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path $Exe).Path
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            foreach ($argument in $Arguments) { [void]$psi.ArgumentList.Add($argument) }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw "無法啟動 $Exe" }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            if ($process.ExitCode -ne $ExpectedExitCode) {
              throw "$Exe $($Arguments -join ' ') exit $($process.ExitCode)，預期 $ExpectedExitCode：$stderr"
            }
            if ($stderr) { throw "$Exe 非預期寫入 stderr：$stderr" }
            try { return $stdout | ConvertFrom-Json -Depth 20 }
            catch { throw "$Exe 未輸出合法 JSON：$stdout" }
          }

          foreach ($exe in @('publish/fd/CKToolkit.exe', 'publish/sc/CKToolkit.exe')) {
            $version = Invoke-CliJson $exe @('version', '--json')
            if (-not $version.ok -or $version.command -ne 'version' -or
                $version.data.version -ne $env:CKTOOLKIT_VERSION) {
              throw "$exe version JSON 與 release 版本不符。"
            }

            $tweaks = Invoke-CliJson $exe @('trainer', 'list-tweaks', '--json')
            $flat = @($tweaks.data.tweaks)
            $train = @($flat | Where-Object id -eq 'train_speed')
            $hero = @($flat | Where-Object id -eq 'hero_max_army')
            $sight = @($flat | Where-Object id -eq 'hero_sight')
            if (-not $tweaks.ok -or $tweaks.command -ne 'trainer list-tweaks' -or
                $tweaks.data.totalTweaks -ne 28 -or $train.Count -ne 1 -or
                -not $train[0].scopedSupported -or
                (@($train[0].scopes) -join ',') -ne 'self,enemy' -or
                $hero.Count -ne 1 -or -not $hero[0].scopedSupported -or
                $sight.Count -ne 1 -or $sight[0].scopedSupported) {
              throw "$exe scoped tweak CLI metadata 不符合目前公開契約。"
            }

            $invalid = Invoke-CliJson -Exe $exe `
              -Arguments @('unknown-release-smoke', '--json') -ExpectedExitCode 2
            if ($invalid.ok -or $invalid.command -ne 'unknown-release-smoke' -or
                @($invalid.errors).Count -lt 1) {
              throw "$exe 無效命令未維持 exit 2／JSON error envelope 契約。"
            }
            Write-Host "$exe CLI smoke test 通過。"
          }

      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $frameworkExe = "dist\CKToolkit-$tag-win-x64.exe"
          $selfContainedExe = "dist\CKToolkit-$tag-win-x64-self-contained.exe"
          Copy-Item publish\fd\CKToolkit.exe $frameworkExe
          Copy-Item publish\sc\CKToolkit.exe $selfContainedExe
          Copy-Item ckperf-release-sha256.txt dist\CKPerf-SHA256.txt

          # 雜湊檔用 sha256sum 的格式，任何平台都能 `sha256sum -c` 直接驗。
          $lines = Get-Item $frameworkExe, $selfContainedExe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) *$($_.Name)"
          }
          [System.IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")

          Get-ChildItem dist | ForEach-Object { "{0,-56} {1,12:N0} bytes" -f $_.Name, $_.Length }

      # 證明這些 exe 出自本儲存庫的這個 commit。不加 continue-on-error：
      # 證明產不出來卻照樣發布，等於把「無法驗證」偽裝成「已驗證」。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/CKToolkit-${{ github.ref_name }}-win-x64*.exe'

      # 用內建的 gh CLI 而非第三方 action：發布這一步握有 contents: write，
      # 沒必要為了省幾行 YAML 就多引入一個需要信任的相依。
      #
      # 發行說明用字串陣列組出來，不用 PowerShell here-string：here-string 的
      # 結束符必須在第 0 欄，會直接違反 YAML 區塊純量的縮排規則。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $notes = @(
            '## 下載哪一個'
            ''
            '| 檔案 | 大小 | 需要先安裝什麼 |'
            '|---|---|---|'
            "| ``CKToolkit-$tag-win-x64-self-contained.exe`` | ~50 MB | **不需要**，雙擊即用（推薦） |"
            "| ``CKToolkit-$tag-win-x64.exe`` | ~3 MB | [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) |"
            ''
            '兩者功能完全相同，差別只在有沒有把 .NET 執行階段包進去。'
            ''
            '## 驗證這些檔案'
            ''
            '發布物由 GitHub Actions 從原始碼建置並簽署 build provenance 證明，可自行查核：'
            ''
            '```bash'
            "gh attestation verify CKToolkit-$tag-win-x64-self-contained.exe --repo $repo"
            '```'
            ''
            '`SHA256SUMS.txt` 為 sha256sum 格式，可直接 `sha256sum -c SHA256SUMS.txt`。'
            '`CKPerf-SHA256.txt` 記錄正式 EXE 內嵌之 source-built `ckperf.dll` 雜湊；可與執行期展開檔比對。'
            ''
            '## 系統需求'
            ''
            'Windows 10 / 11 (x64)、Steam 版《Celtic Kings: Rage of War》。'
            ''
            '> 本工具為非官方社群專案，與 Haemimont Games 及發行商無關。所有翻譯內容均由 AI 產生。詳見 README。'
          )
          [System.IO.File]::WriteAllText("$PWD\release-notes.md", ($notes -join "`n") + "`n")

          # dist 可能同時有原生建置的 ckperf/ 子目錄或先前建置殘留；只允許這四個
          # 明確 staged 的發布資產，不能用 Get-ChildItem 把其他檔案意外公開。
          $assets = @(
            "$PWD\dist\CKToolkit-$tag-win-x64.exe"
            "$PWD\dist\CKToolkit-$tag-win-x64-self-contained.exe"
            "$PWD\dist\SHA256SUMS.txt"
            "$PWD\dist\CKPerf-SHA256.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "缺少發布資產：$asset"
            }
          }
          gh release create $tag $assets --title "CK-RageOfWar Toolkit $tag" --notes-file release-notes.md
